[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "framecraft-studio"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
    "redis>=5,<8", "boto3>=1.37,<2", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
    "python-pptx>=1.0,<2", "pypdf>=6,<8", "pypdfium2>=5.15,<6", "reportlab>=4.3,<5",
    "pillow>=11,<14", "defusedxml>=0.7,<1", "pwdlib[argon2]>=0.2,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["lucide_icons/*.png", "lucide_icons/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
